version: "3.8"
services:
  mysql:
    image: mysql:8
    container_name: mysql-db

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: employee_db

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: employee-backend-container

    ports:
      - "5000:5000"

    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: employee_db

    depends_on:
      - mysql

  frontend:
    build: ./frontend
    container_name: employee-frontend-container

    ports:
      - "8080:80"

    depends_on:
      - backend

volumes:
  mysql-data: