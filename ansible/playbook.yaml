---
- name: Configure Employee Management Server
  hosts: webservers
  become: true
  gather_facts: true
  
  tasks:
    - name: Display operating system
      ansible.builtin.debug:
        msg: "Server OS: {{ ansible_facts['distribution'] }}"

    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Start Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ec2-user to docker group
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: true

    - name: Verify Docker service
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"